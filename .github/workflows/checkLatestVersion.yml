name: Check npm version

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check package version against npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view "$PACKAGE_NAME" version)

          echo "Package: $PACKAGE_NAME"
          echo "Repository version: $LOCAL_VERSION"
          echo "Latest npm version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Repository: $LOCAL_VERSION"
            echo "npm:        $NPM_VERSION"
            exit 1
          fi

          echo "✅ Version matches npm."